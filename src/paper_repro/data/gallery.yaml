  python: '3.8'
  device: cpu
  env:
    no_deps_file: true
    install_project: true
    extra:
    - pandas
  command: python -m examples.experiments.regression_exp --dataset=yacht --score=MLE --natural
  timeout: 900
  metric:
    name: ngb
    select: last
  claim:
    source: paper
    table: Table 1
    row: Yacht
    column: NGBoost
    value: 0.2
    metric: NLL
    where: 'arXiv:1910.03225, page 7, Table 1, row Yacht, column NGBoost: 0.20 ± 0.26'
    text: Yacht 308 0.20 ± 0.26 ...
    pm: 0.26
  not_checked:
  - The script's last line is `== RMSE GBM=... NGB=..., NLL NGB=<mean> +/ <std>`; the value compared is
