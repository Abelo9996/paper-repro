- slug: mnist1d-logistic
  title: 'Scaling Down Deep Learning with MNIST-1D: Table 1, the paper''s notebook'
  area: classic vision
  arxiv: '2011.14439'
  repo: greydanus/mnist1d
  commit: e2f536fa86442c13473b433d579e9852ec4d1c1d
  python: '3.12'
  device: cpu
  env:
    install_project: true
    extra:
    - torch
    - ipython
    - nbformat
  setup:
  - mkdir -p ../nbrun/figures && ln -sfn ../repo ../nbrun/mnist1d
  command: cd ../nbrun && ipython mnist1d/notebooks/mnist1d-classification.ipynb
  timeout: 900
  metric:
    name: test_accuracy
  claim:
    source: paper
    table: Table 1
    row: MNIST-1D (shuffled)
    column: Logistic regression
    value: 32
    percent: true
    pm: 1
  tolerance:
    abs: 1.0
    why: The paper states 32 ± 1 (standard deviation over three runs).
  deviations:
  - The notebook adds ./mnist1d/notebooks to sys.path and saves figures/benchmark.png, as if run from
    a directory holding a checkout named mnist1d and a figures folder; it is run from such a directory
    beside the checkout (a symlink mnist1d -> the checkout, and an empty figures/). ipython, nbformat
    and torch (from the repo's [all] extra) were installed to run it.
  - MPLBACKEND=Agg is set so the plotting cells draw off screen instead of waiting on a window (without
    it the run hung in the first plotting cell after all 8 models had trained).
  not_checked:
  - The notebook trains 8 models; the last value it prints is the logistic regression on shuffled MNIST-1D,
    the row compared here. The other cells of Table 1 are in the run's stdout but were not compared.
  env_vars:
    MPLBACKEND: Agg
  vetted:
    verdict: reproduced
    label: REPRODUCED
    headline: 'Reproduced: accuracy claimed 32% ± 1 (treated as 31 to 33), measured 31.6%, inside the
      claimed range, within the tolerance of ±1.'
    date: '2026-10-23'
    paper_repro: 0.2.0
    host: Apple M4, macOS 26.2
    python: 3.12.13
    key_packages:
      torch: 2.14.1
      numpy: 2.5.4
      scipy: 1.18.1
      networkx: '3.7'
    seeds:
    - null
    run_wall_seconds: 165.6
    wall_seconds: 170.3
    measured: 31.6
    values:
    - 31.6
    study: mnist1d-logistic
