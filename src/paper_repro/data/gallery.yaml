# Papers whose official code was run end to end by `paper-repro repro <slug>` on a CPU laptop.
# Every number under `vetted` was written by scripts/vet_gallery.py from a recorded run's
# report.json; none is typed in. A recipe pins what `repro` needs: commit, Python, environment,
# setup, the exact command with its seeds, the metric to read and the claim to compare with.
papers:
- slug: nanogpt-shakespeare-char
  title: 'nanoGPT: character-level Shakespeare, the README''s CPU configuration'
  area: language modeling
  repo: karpathy/nanoGPT
  commit: 3adf61e154c3fe3fca428ad6bc3818b27a3b8291
  python: '3.12'
  device: cpu
  env:
    from_readme: true
  setup:
  - python data/shakespeare_char/prepare.py
  command: python train.py config/train_shakespeare_char.py --device=cpu --compile=False --eval_iters=20
    --log_interval=1 --block_size=64 --batch_size=12 --n_layer=4 --n_head=4 --n_embd=128 --max_iters=2000
    --lr_decay_iters=2000 --dropout=0.0
  timeout: 1200
  metric:
    name: val_loss
  claim:
    source: readme
    value: 1.88
    line: 88
  not_checked:
  - train.py seeds torch with a fixed 1337, so repeated runs measure determinism, not seed variance; one
    run is made.
  vetted:
    verdict: reproduced
    label: REPRODUCED
    headline: 'Reproduced: loss claimed 1.88, measured 1.8857, 0.0057 away, within the tolerance of ±0.0188.'
    date: '2026-10-23'
    paper_repro: 0.2.0
    host: Apple M4, macOS 26.2
    python: 3.12.13
    key_packages:
      torch: 2.14.1
      numpy: 2.5.4
      networkx: '3.7'
    seeds:
    - null
    run_wall_seconds: 34.5
    wall_seconds: 36.8
    measured: 1.8857
    values:
    - 1.8857
    study: nanogpt-shakespeare-char
- slug: pygcn-cora
  title: Semi-Supervised Classification with Graph Convolutional Networks (PyTorch code)
  area: graph nets
  arxiv: '1609.02907'
  repo: tkipf/pygcn
  commit: 1600b5b748b3976413d1e307540ccc62605b4d6d
  python: '3.12'
  device: cpu
  command: cd pygcn && python train.py --no-cuda --seed {seed}
  seeds:
  - 0
  - 1
  - 2
  timeout: 600
  metric:
    name: accuracy
  claim:
    source: paper
    table: Table 2
    row: GCN (this paper)
    column: Cora
    value: 81.5
    percent: true
  tolerance:
    abs: 1.0
    why: Cora's test set has 1000 nodes, so accuracy moves in steps of 0.1 points and seed noise is several
      of them.
  not_checked:
  - 'The pygcn README says it is not intended to reproduce the paper''s results: it trains on the first
    140 nodes in file order, not the paper''s split of 20 labels per class. The paper''s own code is tkipf/gcn
    (TensorFlow 1).'
  - 'The runs are not deterministic on this CPU even with fixed seeds: three repro runs of seeds 0, 1,
    2 on this machine gave means of 82.57, 82.7 (the vetted run) and 83.07; each was PARTIAL.'
  vetted:
    verdict: close
    label: PARTIAL
    headline: 'Partial (close): accuracy claimed 81.5%, measured 82.7% (mean of 3 runs), 1.2 away: outside
      the tolerance of ±1 but inside the close band of ±3.'
    date: '2026-10-23'
    paper_repro: 0.2.0
    host: Apple M4, macOS 26.2
    python: 3.12.13
    key_packages:
      torch: 2.14.1
      numpy: 2.5.4
      scipy: 1.18.1
      networkx: '3.7'
    seeds:
    - 0
    - 1
    - 2
    run_wall_seconds: 11.0
    wall_seconds: 13.1
    measured: 82.7
    values:
    - 82.1
    - 82.9
    - 83.1
    std: 0.52915
    study: pygcn-cora
